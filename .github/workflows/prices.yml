name: Refresh price cache

on:
  schedule:
    - cron: "37 22 * * 1-5" # after the US close, weekdays
  workflow_dispatch:
  push:
    paths:
      - data/tickers.json
      - scripts/fetch_prices.py
      - scripts/fetch_funds.py
      - .github/workflows/prices.yml

permissions:
  contents: write

concurrency:
  group: prices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch daily closes
        run: python scripts/fetch_prices.py
      - name: Refresh fund holdings and classifications
        continue-on-error: true
        run: python scripts/fetch_funds.py
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices data/funds.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Update price and fund data $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
